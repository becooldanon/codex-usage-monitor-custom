name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows x64
        shell: pwsh
        run: |
          ./Build-And-Install.ps1 -BuildOnly -Standalone

      - name: Package application and licenses
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'CodexUsageMonitorCustom'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item '.\publish\*' $staging -Recurse -Force
          Copy-Item 'README.md', 'LICENSE', 'THIRD-PARTY-NOTICES.md', 'UPSTREAM-LICENSE.txt' $staging -Force
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'development' }
          $zip = Join-Path $env:GITHUB_WORKSPACE "CodexUsageMonitorCustom-$tag-win-x64.zip"
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-package
          path: CodexUsageMonitorCustom-*-win-x64.zip

      - name: Publish GitHub release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: CodexUsageMonitorCustom-*-win-x64.zip
